<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <!-- 'wasm-unsafe-eval' is REQUIRED for the PVAC (FHE) module. Chromium blocks
         WebAssembly.instantiate() under a CSP that lacks it, which made the WASM
         module silently fail to load. It grants WebAssembly compilation only —
         it does NOT re-enable eval() for JavaScript. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Orion Wallet — Client-side React wallet for the Octra Network with FHE (PVAC) support." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orion Wallet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icons/wallet.svg" />
    <link rel="apple-touch-icon" href="/icons/wallet.svg" />
    <title>Orion Wallet — Octra Network</title>
    <style>
      /* Pre-paint critical styles to avoid FOUC */
      html { background: #0a0a0f; }
      html[data-theme='light'] { background: #fafafa; }
      body { margin: 0; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Initial loading state */
      #root:empty::before {
        content: 'Loading Orion Wallet…';
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #6e6e85;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
